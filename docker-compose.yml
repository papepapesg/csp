# SOPHIX BSS — Docker foundation stack.
#
# Default stack is fully Laravel-native (Postgres + Redis only). The heavier
# reference-architecture services (Kafka, Camunda, Drools) are opt-in via
# compose profiles so the stack matches the "all Laravel, swappable" decision:
#
#   docker compose up -d                      # native stack
#   docker compose --profile kafka up -d      # add Kafka + UI
#   docker compose --profile camunda up -d    # add Camunda
#   docker compose --profile drools up -d     # add Drools (KIE) server

name: sophix-bss

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: runtime
    image: sophix/bss-app
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - storage_data:/var/www/html/storage
    networks: [sophix]

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: sophix/bss-web
    restart: unless-stopped
    # No host port: Caddy fronts 80/443 and reverse-proxies to web:80 internally.
    expose: ["80"]
    depends_on:
      app: { condition: service_started }
    networks: [sophix]

  # Edge: wildcard-app TLS (Let's Encrypt) + reverse proxy. One process owns 80/443 and
  # routes every app subdomain (slug.<base>) to the internal nginx (web).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_started }
    networks: [sophix]

  queue:
    image: sophix/bss-app
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: queue
    env_file: [.env]
    depends_on:
      app: { condition: service_started }
    volumes:
      - storage_data:/var/www/html/storage
    networks: [sophix]

  scheduler:
    image: sophix/bss-app
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: scheduler
    env_file: [.env]
    depends_on:
      app: { condition: service_started }
    volumes:
      - storage_data:/var/www/html/storage
    networks: [sophix]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sophix}
      POSTGRES_USER: ${DB_USERNAME:-sophix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sophix}
    ports:
      - "${DB_PORT_FORWARD:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sophix} -d ${DB_DATABASE:-sophix}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sophix]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_FORWARD:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sophix]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks: [sophix]

  # ---------------- Opt-in reference services (profiles) ----------------
  kafka:
    image: bitnami/kafka:3.7
    profiles: [kafka]
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    networks: [sophix]

  camunda:
    image: camunda/camunda-bpm-platform:run-latest
    profiles: [camunda]
    restart: unless-stopped
    ports:
      - "${CAMUNDA_PORT:-8090}:8080"
    networks: [sophix]

  drools:
    image: quay.io/kiegroup/kie-server-showcase:latest
    profiles: [drools]
    restart: unless-stopped
    ports:
      - "${DROOLS_PORT:-8091}:8080"
    networks: [sophix]

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  sophix:
    driver: bridge
