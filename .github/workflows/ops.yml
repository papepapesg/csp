name: ops

# Remote-ops channel: lets the assistant execute deploy/diagnostic commands on the
# self-hosted VPS runner and read the output from the job log. Disposable test box only;
# remove the runner (svc.sh uninstall) when the test campaign is over.
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: Shell command(s) to run on the VPS (executed from the deploy clone)
        required: true
        type: string

run-name: "ops: ${{ inputs.cmd }}"

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Execute on VPS
        shell: bash
        working-directory: /root/csp/sophix
        run: |
          set -euxo pipefail
          ${{ inputs.cmd }}
