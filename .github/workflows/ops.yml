name: ops

# Remote-ops channel: the assistant commits a command into .github/ops/cmd.sh; the
# self-hosted VPS runner executes it from the deploy clone; the assistant reads the
# job log via the API. Push-triggered because the integration token has Actions
# read (logs) but not write (workflow_dispatch). Disposable test box only — remove
# the runner (svc.sh uninstall) when the test campaign is over.
on:
  push:
    paths:
      - '.github/ops/cmd.sh'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Execute on VPS (deploy clone)
        shell: bash
        working-directory: /root/csp/sophix
        run: |
          set -euxo pipefail
          git pull --ff-only
          bash .github/ops/cmd.sh
